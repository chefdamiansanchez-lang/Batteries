name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar proyecto (con o sin zip)
        run: |
          mkdir -p /tmp/work
          if ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do unzip -o -q "$z" -d /tmp/work; done
          else
            rsync -a --exclude .git ./ /tmp/work/
          fi
          S=$(find /tmp/work -name settings.gradle.kts | head -n 1)
          if [ -z "$S" ]; then echo "No se encontró settings.gradle.kts"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
            echo ""
            echo "=========== RESUMEN DE ERRORES ==========="
            grep -E "^e: |What went wrong|error:|AAPT" -A3 build.log | head -60
            exit 1
          }

      - name: Preparar APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/salida"
          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No se encontró el APK"; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/salida/SaludBateria.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Salud-Bateria-APK
          path: salida/SaludBateria.apk
          if-no-files-found: error
